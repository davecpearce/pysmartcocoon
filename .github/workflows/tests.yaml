---
name: Linting

# Deliberately no `schedule:` trigger here. GitHub disables scheduled
# workflows after 60 days of repository inactivity, and a disabled workflow
# reports nothing at all rather than failing -- so it goes unnoticed. That is
# what happened to the equivalent file in hacs_smartcocoon, which sat
# switched off for ten weeks while pull requests merged against stale checks.
#
# nightly.yml holds the schedule and calls this workflow instead. If that one
# is disabled, the loss is a nightly re-run rather than all pull request
# validation.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_call:

# Minor version only, deliberately. setup-python treats an exact patch
# ("3.13.2") as a hard match, and the runner image ships whichever patches it
# ships -- when ubuntu-latest moved to Ubuntu 26.04 it stopped carrying 3.13.2
# and this failed with "version not found", on a commit nobody had touched.
# requires-python = ">=3.13.2" is the real floor; any 3.13.x satisfies it.
env:
  DEFAULT_PYTHON: "3.13"

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install -e .
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --color=always
      # Previously scoped to const.py and types.py only, which left the
      # strict settings in pyproject.toml (disallow_untyped_defs and friends)
      # unenforced across the modules that actually do the work. The whole
      # package passes as-is, so there was nothing to gain by narrowing it.
      - name: Run mypy
        run: |
          python -m pip install mypy
          mypy pysmartcocoon
      - name: Run pytest (excluding integration tests)
        run: |
          pytest tests/ -v -k "not integration"
