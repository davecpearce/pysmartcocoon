---
repos:
  # Guard the pins below. black, isort and bandit are pinned both here as a
  # `rev` and in requirements_test.txt, and pre-commit is what gates CI --
  # so when the two drift, the tool judging a pull request is not the one
  # anyone runs locally. Dependabot bumps only requirements_test.txt and the
  # autoupdate workflow only the revs, so each would drift the pair alone.
  - repo: local
    hooks:
      - id: check-tool-pins
        name: tools pinned in two files must agree
        entry: python scripts/check_tool_pins.py
        language: python
        additional_dependencies: ["pyyaml"]
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|requirements_test\.txt)$
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py39-plus"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args:
          - --quiet
          - --line-length=79
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args:
          - --max-line-length=79
          - --ignore-imports=yes
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --quiet
          - --format=custom
          - --configfile=tests/bandit.yaml
  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
